# Render Blueprint: one Docker web service runs both the API and the Angular app.
# Render has no managed MySQL: bring your own (TiDB Cloud, Aiven, RDS, ...).
services:
  - type: web
    name: carrental-carleaseapp
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # paste your MySQL URL in the Render dashboard (never in git)
      - key: DB_SSL
        value: "true" # managed MySQL requires TLS; set to "false" only for a database without TLS
